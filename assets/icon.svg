<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6BCB77"/>
      <stop offset="100%" style="stop-color:#4DAA57"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.18"/>
    </filter>
    <filter id="shadowSm" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- 圆角背景 -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>

  <!-- 刻度尺主体：斜向放置，白色底 + 深绿刻度 -->
  <g transform="rotate(-28, 256, 256)" filter="url(#shadow)">
    <!-- 刻度尺条 -->
    <rect x="60" y="222" width="392" height="68" rx="12" fill="#fff"/>

    <!-- 主刻度线（大刻度） -->
    <g stroke="#2D7A37" stroke-linecap="round">
      <line x1="100" y1="222" x2="100" y2="258" stroke-width="6"/>
      <line x1="170" y1="222" x2="170" y2="258" stroke-width="6"/>
      <line x1="240" y1="222" x2="240" y2="258" stroke-width="6"/>
      <line x1="310" y1="222" x2="310" y2="258" stroke-width="6"/>
      <line x1="380" y1="222" x2="380" y2="258" stroke-width="6"/>
      <line x1="450" y1="222" x2="450" y2="258" stroke-width="6"/>
    </g>

    <!-- 副刻度线（小刻度） -->
    <g stroke="#2D7A37" stroke-linecap="round" opacity="0.55">
      <line x1="135" y1="222" x2="135" y2="246" stroke-width="3.5"/>
      <line x1="205" y1="222" x2="205" y2="246" stroke-width="3.5"/>
      <line x1="275" y1="222" x2="275" y2="246" stroke-width="3.5"/>
      <line x1="345" y1="222" x2="345" y2="246" stroke-width="3.5"/>
      <line x1="415" y1="222" x2="415" y2="246" stroke-width="3.5"/>
    </g>

    <!-- 底部测量刻度条 -->
    <rect x="60" y="290" width="392" height="16" rx="5" fill="#E8F5E9"/>
  </g>

  <!-- 哑铃：深墨绿色，与白色刻度尺形成鲜明对比 -->
  <g filter="url(#shadow)">
    <!-- 哑铃杆 -->
    <rect x="176" y="240" width="160" height="32" rx="7" fill="#2D3E2F"/>

    <!-- 左侧杠铃片 -->
    <rect x="136" y="210" width="32" height="92" rx="10" fill="#2D3E2F"/>
    <rect x="160" y="196" width="20" height="120" rx="6" fill="#3A5240"/>

    <!-- 右侧杠铃片 -->
    <rect x="344" y="210" width="32" height="92" rx="10" fill="#2D3E2F"/>
    <rect x="332" y="196" width="20" height="120" rx="6" fill="#3A5240"/>
  </g>

  <!-- 中心进度点：橙色象征精准记录 -->
  <circle cx="256" cy="256" r="28" fill="#FF9A8B" stroke="#fff" stroke-width="6" filter="url(#shadowSm)"/>
  <circle cx="256" cy="256" r="13" fill="#fff"/>
</svg>
