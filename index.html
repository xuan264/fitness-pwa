<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#6BCB77" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="璇刻">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <title>璇刻</title>
</head>
<body>
  <div id="app">
    <header id="app-header">
      <h1>璇刻</h1>
      <div class="header-subtitle">👥👥</div>
    </header>
    <main id="page-container">
      <!-- 白屏检测：如果 app.js 加载失败，3秒后显示提示 -->
      <div id="loading-fallback" style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;text-align:center;">
        <div style="font-size:36px;margin-bottom:12px;">⏳</div>
        <div style="font-size:14px;color:var(--text-secondary);">加载中...</div>
      </div>
    </main>
    <nav id="bottom-nav"></nav>
  </div>
  <div id="toast-container"></div>
  <div id="modal-container"></div>

  <!-- 白屏检测脚本：如果 5 秒后 page-container 仍只有 loading-fallback，说明 app.js 加载失败 -->
  <script>
    (function() {
      var startTime = Date.now();
      var checkInterval = setInterval(function() {
        var container = document.getElementById('page-container');
        var fallback = document.getElementById('loading-fallback');
        // 如果 app.js 成功渲染，loading-fallback 会被替换掉
        if (!fallback || !fallback.parentNode || container.children.length > 1 || container.innerHTML.indexOf('loading-fallback') === -1) {
          clearInterval(checkInterval);
          return;
        }
        // 5 秒后还没加载出来，显示错误提示和刷新按钮
        if (Date.now() - startTime > 5000) {
          clearInterval(checkInterval);
          container.innerHTML = '<div class="page"><div class="card text-center"><div style="font-size:36px;">😵</div><div class="font-bold mt-8" style="font-size:16px;">加载失败</div><div class="font-sm text-secondary mt-8" style="line-height:1.6;">可能是缓存版本不匹配<br>请点击下方按钮刷新</div><button class="btn btn-primary mt-8" onclick="location.reload(true)" style="margin-top:16px;">🔄 重新加载</button><button class="btn mt-8" onclick="if(confirm(\\'清除缓存并重新加载？\\')){caches.keys().then(function(k){Promise.all(k.map(function(c){return caches.delete(c)})).then(function(){location.reload()})})}" style="margin-left:8px;border:1px solid var(--divider);background:var(--surface);">🧹 清除缓存</button></div></div>';
        }
      }, 1000);
    })();
  </script>

  <script type="module" src="js/app.js"></script>
</body>
</html>
